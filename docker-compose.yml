services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xa4y
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidsave_secret}
      POSTGRES_DB: vidsave
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # PostgreSQL должен быть доступен только локальному bot-контейнеру через host network.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xa4y -d vidsave"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      args:
        # Изменение версии инвалидирует Docker-кэш слоя с Instagram/TikTok extractors.
        YT_DLP_VERSION: ${YT_DLP_VERSION:-2026.10.26}
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # network_mode: host → бот видит localhost хоста, postgres доступен через loopback-порт 55432
      DATABASE_URL: postgres://xa4y:${POSTGRES_PASSWORD:-vidsave_secret}@127.0.0.1:55432/vidsave?sslmode=disable
      # Host-network service; bind exclusively to VPS loopback, never 0.0.0.0.
      ANALYTICS_LISTEN_ADDR: "127.0.0.1:18873"

volumes:
  pgdata:
